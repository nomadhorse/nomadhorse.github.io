<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nomad Horse | Trailers e Motorhomes Personalizados</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#090909;
    color:#fff;
    line-height:1.6;
}

header{
    position:absolute;
    top:0;
    width:115%;
    z-index:100;
    background:rgba(5,5,5,.96);
    border-bottom:1px solid #292929;
    padding:20px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:800;
    letter-spacing:4px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    margin-left:25px;
    font-size:14px;
}

nav a:hover{
    color:#fff;
}

.hero{
    min-height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:70px 20px;
   background-image:linear-gradient(rgba(0,0,0,0.30),rgba(0,0,0,0.30)),url('11.jpeg');
   background-size:100% auto;
background-position:center;
   background-repeat:no-repeat;
    
}

.hero-content{
    max-width:900px;
    transform:translateY(-90px,-35px);
}

.hero small{
    text-transform:uppercase;
    letter-spacing:5px;
    color:#aaa;
}

.hero h1{
    font-size:58px;
    line-height:1.08;
    margin:18px 0;
}

.hero p{
    max-width:760px;
    margin:0 auto 30px;
    font-size:20px;
    color:#ccc;
}

.btn{
    display:inline-block;
    background:#fff;
    color:#111;
    padding:16px 30px;
    border-radius:7px;
    text-decoration:none;
    font-weight:bold;
    margin:6px;
}

.btn-dark{
    background:transparent;
    color:#fff;
    border:1px solid #777;
}

section{
    padding:80px 8%;
}

.section-title{
    text-align:center;
    max-width:750px;
    margin:0 auto 45px;
}

.section-title h2{
    font-size:38px;
    margin-bottom:12px;
}

.section-title p{
    color:#aaa;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:35px 28px;
}

.card h3{
    font-size:22px;
    margin-bottom:12px;
}

.card p{
    color:#aaa;
}

.destaque{
    background:#101010;
}

.numeros{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    text-align:center;
    gap:20px;
}

.numero{
    padding:25px;
}

.numero strong{
    display:block;
    font-size:35px;
    margin-bottom:5px;
}

.numero span{
    color:#999;
}

.projeto{
    text-align:center;
    background:linear-gradient(135deg,#181818,#080808);
}

.projeto h2{
    font-size:42px;
    margin-bottom:15px;
}

.projeto p{
    max-width:720px;
    margin:0 auto 28px;
    color:#bbb;
    font-size:18px;
}

.contato{
    text-align:center;
}

.contato h2{
    font-size:40px;
    margin-bottom:15px;
}

.contato p{
    color:#aaa;
    margin-bottom:25px;
}

footer{
    text-align:center;
    padding:35px 20px;
    border-top:1px solid #292929;
    color:#777;
    font-size:14px;
}

@media(max-width:800px){

    header{
        justify-content:center;
    }

    nav{
        display:none;
    }

    .hero h1{
        font-size:40px;
    }

    .hero p{
        font-size:17px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .numeros{
        grid-template-columns:1fr 1fr;
    }

    .section-title h2,
    .projeto h2,
    .contato h2{
        font-size:31px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">NOMAD HORSE</div>

    <nav>
        <a href="#empresa">A Nomad Horse</a>
        <a href="#solucoes">Soluções</a>
        <a href="#projeto">Seu Projeto</a>
        <a href="#contato">Contato</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <small>Trailers • Motorhomes • Projetos Especiais</small>

        <h1>Liberdade para ir mais longe.</h1>

        <p>
            Trailers e motorhomes personalizados, desenvolvidos para
            transformar viagens, trabalho e aventura em experiências
            únicas sobre rodas.
        </p>

        <a class="btn" href="#solucoes">CONHEÇA NOSSOS PROJETOS</a>
